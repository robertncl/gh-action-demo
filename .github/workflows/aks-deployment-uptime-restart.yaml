name: AKS Deployment Uptime Check & Restart

on:
  workflow_dispatch:
    inputs:
      clusters_file_path:
        description: Path to clusters JSON in repo
        required: true
        default: .github/aks/clusters.json
      days_threshold:
        description: Days threshold before restart
        required: false
        default: '30'
  #schedule:
  #  - cron: '21 3 * * *'

permissions:
  id-token: write
  contents: read

jobs:
  check-and-restart:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python (for human age formatting)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'

      - name: Azure login (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install kubectl
        uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0

      - name: Install jq
        run: sudo apt-get update -y && sudo apt-get install -y jq

      - name: Validate clusters file exists
        env:
          CLUSTERS_FILE_PATH: ${{ inputs.clusters_file_path }}
        run: |
          test -f "$CLUSTERS_FILE_PATH" || {
            echo "Clusters file not found: $CLUSTERS_FILE_PATH" >&2
            exit 1
          }

      - name: Run uptime check
        shell: bash
        env:
          CLUSTERS_FILE_PATH: ${{ inputs.clusters_file_path }}
          DAYS_THRESHOLD: ${{ inputs.days_threshold }}
        run: |
          chmod +x .github/scripts/check-aks-uptime.sh
          .github/scripts/check-aks-uptime.sh "$CLUSTERS_FILE_PATH" "$DAYS_THRESHOLD"


